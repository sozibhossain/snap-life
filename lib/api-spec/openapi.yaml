openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: sync
    description: Cross-device sync of per-user app data
  - name: admin
    description: Admin-only read endpoints powering the SNAP Life Admin dashboard
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /sync/snapshot:
    get:
      operationId: getSyncSnapshot
      tags: [sync]
      summary: Pull the full per-user sync snapshot
      description: |
        Returns every per-user document the server has stored for the
        authenticated user (profile, daily nutrition / activity / meal-plan
        rows, wellbeing entries, gamification state, badges, assessments,
        supplements). Used on app launch to reconcile AsyncStorage to the
        latest server view (server wins on conflict — last-write-wins).
      responses:
        "200":
          description: Snapshot
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SyncSnapshot"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /me:
    get:
      operationId: getMe
      tags: [me]
      summary: Get the authenticated user's canonical profile fields
      description: |
        Returns the typed columns the mobile app needs to render the Edit
        Profile screen on a fresh device install (avatar URL, country,
        timezone, display name, email) without round-tripping the full
        /sync/snapshot payload.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MeResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /me/profile:
    patch:
      operationId: patchMeProfile
      tags: [me]
      summary: Patch the authenticated user's profile (country / timezone)
      description: |
        Strict, validated counterpart to PUT /sync/profile. Accepts a
        partial update — only the fields present in the body are written
        — and rejects invalid country / timezone values with 400. Returns
        the updated profile so the client can reconcile without a follow-up
        GET. Use this from interactive Edit Profile flows; use /sync/profile
        for the offline write-through queue.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MeProfilePatchBody"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MeProfilePatchResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /me/avatar:
    post:
      operationId: postMeAvatar
      tags: [me]
      summary: Promote a stored object to the user's profile photo
      description: |
        Two-step upload: 1) the client requests a presigned URL via
        /storage/uploads/request-url, 2) it PUTs the image bytes directly
        to GCS, 3) it POSTs the returned `objectPath` here. The server
        validates the stored object's content-type + size and persists
        the path on user_profile.avatar. Rendering goes through
        GET /storage/objects/<id>.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MeAvatarBody"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MeAvatarResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /me/analytics-consent:
    get:
      operationId: getMeAnalyticsConsent
      tags: [me]
      summary: Read the authenticated user's optional analytics consent
      responses:
        "200":
          description: Current consent; defaults to both choices off.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AnalyticsConsent"
        "401":
          $ref: "#/components/responses/Unauthorized"
    put:
      operationId: putMeAnalyticsConsent
      tags: [me]
      summary: Replace optional community analytics and research consent
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AnalyticsConsentBody"
      responses:
        "200":
          description: Saved consent
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AnalyticsConsent"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: Object not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SyncError"
        "413":
          description: Object exceeds the avatar size cap
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SyncError"
        "415":
          description: Object content-type is not an allowed image type
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SyncError"

  /storage/uploads/request-url:
    post:
      operationId: requestUploadUrl
      tags: [storage]
      summary: Request a presigned URL for direct-to-GCS upload
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UploadUrlRequest"
      responses:
        "200":
          description: Presigned URL generated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UploadUrlResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "500":
          description: Internal error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SyncError"

  /sync/profile:
    put:
      operationId: putSyncProfile
      tags: [sync]
      summary: Replace the user's profile + preferences
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SyncProfileBody"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SyncOk"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /sync/nutrition/{date}:
    put:
      operationId: putSyncNutritionDay
      tags: [sync]
      summary: Upsert one day's nutrition log
      parameters:
        - $ref: "#/components/parameters/DayParam"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SyncDayBody"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SyncOk"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /sync/activity/{date}:
    put:
      operationId: putSyncActivityDay
      tags: [sync]
      summary: Upsert one day's activity log
      parameters:
        - $ref: "#/components/parameters/DayParam"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SyncDayBody"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SyncOk"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /sync/meal-plan/{date}:
    put:
      operationId: putSyncMealPlanDay
      tags: [sync]
      summary: Upsert one day's meal plan + dietary prefs + favourites
      parameters:
        - $ref: "#/components/parameters/DayParam"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SyncDayBody"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SyncOk"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /sync/supplements:
    put:
      operationId: putSyncSupplements
      tags: [sync]
      summary: Replace the user's supplement state
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SyncStateBody"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SyncOk"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /sync/gamification:
    put:
      operationId: putSyncGamification
      tags: [sync]
      summary: Replace the user's gamification state
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SyncStateBody"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SyncOk"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /sync/wellbeing:
    post:
      operationId: postSyncWellbeingEntry
      tags: [sync]
      summary: Append a wellbeing / session entry
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SyncWellbeingEntryBody"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SyncOk"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /sync/assessment:
    post:
      operationId: postSyncAssessment
      tags: [sync]
      summary: Append a clinical assessment (DEXA / FRAX)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SyncAssessmentBody"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SyncOk"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /sync/outcomes:
    post:
      operationId: postSyncOutcome
      tags: [sync]
      summary: Append an idempotent structured self-reported outcome check-in
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SyncOutcomeBody"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SyncOk"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /admin/me:
    get:
      operationId: getAdminMe
      tags: [admin]
      summary: Probe whether the caller is allowed to use the admin app
      description: |
        Returns 200 + `{ isAdmin: true }` when the caller has a valid
        Clerk session AND `users.isAdmin = true`. Returns 401 when
        unauthenticated and 403 when authenticated-but-not-admin. Used
        by the admin web app to gate **all** admin pages on initial load
        so non-admin users see the NotAuthorised screen immediately,
        without having to interact with the page first.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminMe"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /admin/metrics/users:
    get:
      operationId: getAdminUserMetrics
      tags: [admin]
      summary: Aggregate user counts by tier and signup window
      description: |
        Returns total user count, breakdown by subscription tier
        (none / trial / plus / premium), admin count, and new signups
        for the last 7 / 30 days. Tiers are derived from the
        `subscribers` table — users without a row count as `none`.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminUserMetrics"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /admin/metrics/engagement:
    get:
      operationId: getAdminEngagementMetrics
      tags: [admin]
      summary: Active user counts and wellbeing-session totals
      description: |
        Returns daily / weekly / monthly active users (distinct
        `appUserId` from `interaction_events` over the last
        1 / 7 / 30 days), totals for wellbeing sessions
        (breathing / meditation), and event counts grouped by `kind`.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminEngagementMetrics"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /admin/metrics/community-insights:
    get:
      operationId: getAdminCommunityInsights
      tags: [admin]
      summary: Consent-filtered aggregate community health and engagement insights
      description: Individual rows and Bone Buddy conversation text are never returned. Small cohorts are suppressed.
      responses:
        "200":
          description: Aggregate-only report
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CommunityInsights"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /subscription/me:
    get:
      operationId: getSubscriptionMe
      tags: [subscription]
      summary: Resolve the caller's subscription/trial state (server-managed)
      description: |
        Merges the server-managed 30-day Premium trial granted at
        registration with any RevenueCat-mirrored entitlement. The mobile
        app calls this to render trial-day badges, the TrialPromptCard
        cascade, and the dashboard premium gates without having to
        reason about both sources independently.

        Cascade rules:
          - A real store purchase (paying subscriber) always wins, so
            those callers see `tier ∈ { plus, premium }` and `isOnTrial = false`.
          - A store-side trial supersedes the server trial (the
            RevenueCat webhook clears `trialSource = "server"` and writes
            `"store"` instead) so `isOnTrial = true` with `trialSource = "store"`.
          - The server trial is reported with `trialSource = "server"` and a
            `trialDayOf` in `1..30`. Day-of is computed from `trialEndsAt`,
            which is set once at signup and never moves.
          - When the trial window has elapsed (`trialEndsAt <= now`) the
            response degrades to `tier = "free"` automatically — no
            scheduled job is required.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserSubscription"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /admin/metrics/subscriptions:
    get:
      operationId: getAdminSubscriptionMetrics
      tags: [admin]
      summary: MRR, active subscriptions, trial counts and 30-day churn
      description: |
        Returns active subscriber count by tier, in-trial count,
        approximate MRR (sum of monthly-equivalent prices), and 30-day
        churn (cancellations + expirations in the last 30 days divided
        by the active count at the start of the window). Prices are
        derived from product ids server-side.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminSubscriptionMetrics"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /admin/feedback:
    get:
      operationId: getAdminFeedback
      tags: [admin]
      summary: Recent feedback feed (most-recent-first)
      parameters:
        - name: limit
          in: query
          required: false
          description: Max number of rows (1-200, default 100)
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 100
        - name: feedbackType
          in: query
          required: false
          description: Filter by feedback type
          schema:
            type: string
            enum: [general, testimonial, experience]
        - name: tier
          in: query
          required: false
          description: Filter by user subscription tier
          schema:
            type: string
            enum: [free, trial, plus, premium]
        - name: testimonialOnly
          in: query
          required: false
          description: |
            When true, only return rows the user consented to being used
            as a public testimonial (`allowTestimonialUse = true`).
          schema:
            type: boolean
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminFeedbackList"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /admin/audit:
    get:
      operationId: getAdminAudit
      tags: [admin]
      summary: Paginated audit log of privileged admin and GDPR actions
      description: |
        Returns an append-only list of audit events covering admin-triggered
        and self-service GDPR operations. Rows are never deleted even after
        the target account is removed.
      parameters:
        - name: limit
          in: query
          required: false
          description: Max number of rows (1-200, default 50)
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 50
        - name: offset
          in: query
          required: false
          description: Zero-based row offset for pagination
          schema:
            type: integer
            minimum: 0
            default: 0
        - name: action
          in: query
          required: false
          description: Filter to only events matching this action type
          schema:
            type: string
            enum:
              - test_account_provisioned
              - account_deleted
              - tester_data_reset
        - name: targetAppUserId
          in: query
          required: false
          description: Filter to only events where the target user matches this exact ID
          schema:
            type: string
        - name: actorAppUserId
          in: query
          required: false
          description: Filter to only events where the actor (who performed the action) matches this exact ID
          schema:
            type: string
        - name: from
          in: query
          required: false
          description: Include only events at or after this ISO 8601 date-time (inclusive lower bound on createdAt)
          schema:
            type: string
            format: date-time
        - name: to
          in: query
          required: false
          description: Include only events before or at this ISO 8601 date-time (inclusive upper bound on createdAt)
          schema:
            type: string
            format: date-time
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuditEventList"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /admin/users/{id}:
    delete:
      operationId: deleteAdminUser
      tags: [admin]
      summary: GDPR-delete a user (admin-triggered)
      description: |
        Admin-gated soft-delete for honouring a manual GDPR right-to-
        erasure request. Runs the same cascade as `DELETE /me`:
        redacts PII on the `users` row, scrubs free-text payloads,
        hard-deletes push tokens + legacy bearer tokens, calls Clerk
        `users.deleteUser` (best-effort), and queues the user-facing
        confirmation email. The 30-day hard-delete cron then purges
        the cascaded rows.
      parameters:
        - name: id
          in: path
          required: true
          description: appUserId of the account to delete.
          schema:
            type: string
            minLength: 1
            maxLength: 200
      responses:
        "200":
          description: Account soft-deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminUserDeleteResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: No user with that appUserId
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SyncError"

  /admin/users/lookup:
    get:
      operationId: getAdminUserLookup
      tags: [admin]
      summary: Look up a user profile + subscription by email
      parameters:
        - name: email
          in: query
          required: true
          description: Exact-match email (case-insensitive)
          schema:
            type: string
            minLength: 3
            maxLength: 320
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminUserLookupResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: No user with that email
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SyncError"

components:
  parameters:
    DayParam:
      name: date
      in: path
      required: true
      description: Local-time YYYY-MM-DD calendar day.
      schema:
        type: string
        pattern: "^[0-9]{4}-[0-9]{2}-[0-9]{2}$"

  responses:
    Unauthorized:
      description: Missing or invalid bearer token
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/SyncError"
    BadRequest:
      description: Body / params failed validation
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/SyncError"
    Forbidden:
      description: Authenticated but lacks the required role (admin)
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/SyncError"

  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    SyncOk:
      type: object
      properties:
        ok:
          type: boolean
      required:
        - ok

    SyncError:
      type: object
      properties:
        error:
          type: string
      required:
        - error

    SyncProfileBody:
      type: object
      additionalProperties: false
      properties:
        profile:
          type: object
          additionalProperties: true
        updatedAtMs:
          type: integer
      required:
        - profile

    AnalyticsConsentBody:
      type: object
      additionalProperties: false
      properties:
        communityAnalytics:
          type: boolean
        researchUse:
          type: boolean
      required: [communityAnalytics, researchUse]

    AnalyticsConsent:
      type: object
      additionalProperties: false
      properties:
        communityAnalytics:
          type: boolean
        researchUse:
          type: boolean
        consentVersion:
          type: string
        consentedAt:
          type: ["string", "null"]
          format: date-time
        withdrawnAt:
          type: ["string", "null"]
          format: date-time
      required: [communityAnalytics, researchUse, consentVersion, consentedAt, withdrawnAt]

    MeProfilePatchBody:
      type: object
      additionalProperties: false
      properties:
        country:
          type: string
          nullable: true
          pattern: "^[A-Z]{2}$"
          description: ISO 3166-1 alpha-2 country code, or null to clear.
        timezone:
          type: string
          nullable: true
          description: IANA timezone (e.g. "Europe/London"), or null to clear.

    MeResponse:
      type: object
      additionalProperties: false
      properties:
        ok:
          type: boolean
        profile:
          type: object
          additionalProperties: false
          properties:
            name:
              type: string
              nullable: true
            email:
              type: string
              nullable: true
            avatarUrl:
              type: string
              nullable: true
            country:
              type: string
              nullable: true
            timezone:
              type: string
              nullable: true
          required: [name, email, avatarUrl, country, timezone]
        billingIssue:
          $ref: "#/components/schemas/BillingIssue"
      required: [ok, profile, billingIssue]

    BillingIssue:
      description: |
        Open billing-issue grace window for the calling user, or `null`
        when payment is healthy. Set by the RevenueCat `BILLING_ISSUE`
        webhook; cleared automatically by the next successful entitlement
        write (RENEWAL/INITIAL_PURCHASE/etc) or once `gracePeriodEndsAt`
        elapses (lazy expiry).
      type: ["object", "null"]
      additionalProperties: false
      properties:
        since:
          description: ISO-8601 timestamp of the BILLING_ISSUE webhook (start of grace).
          type: string
          format: date-time
        gracePeriodEndsAt:
          description: |
            ISO-8601 timestamp at which `isActive` flips off. Defaults to
            `since + 3 days`; configurable via the `BILLING_GRACE_DAYS`
            env var.
          type: string
          format: date-time
      required: [since, gracePeriodEndsAt]

    MeProfilePatchResponse:
      type: object
      additionalProperties: false
      properties:
        ok:
          type: boolean
        profile:
          type: object
          additionalProperties: false
          properties:
            avatarUrl:
              type: string
