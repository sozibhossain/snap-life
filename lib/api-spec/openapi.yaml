        limit:
          type: integer
        offset:
          type: integer
      required:
        - items
        - total
        - limit
        - offset

    AdminMe:
      type: object
      additionalProperties: false
      required: [isAdmin]
      properties:
        isAdmin:
          type: boolean
          description: Always true on a 200 response (kept explicit for clarity).

    AdminUserDeleteResult:
      type: object
      additionalProperties: false
      required:
        - ok
        - appUserId
        - deletedAt
        - hardDeleteAfter
        - confirmationEmailQueued
      properties:
        ok:
          type: boolean
        appUserId:
          type: string
        deletedAt:
          type: string
          format: date-time
        hardDeleteAfter:
          type: string
          format: date-time
          description: Day-30 deadline at which the cascaded rows are purged.
        confirmationEmailQueued:
          type: boolean
          description: |
            True when a confirmation email row was appended to
            `pending_emails`. False when the deleted account had no
            email address on file (rare — typically already-redacted
            accounts being re-deleted).

    AdminUserMetrics:
      type: object
      additionalProperties: false
      properties:
        totalUsers:
          type: integer
        adminCount:
          type: integer
        newUsersLast7d:
          type: integer
        newUsersLast30d:
          type: integer
        activeLast7d:
          description: Distinct users with at least one interaction event in the last 7 days.
          type: integer
        activeLast30d:
          description: Distinct users with at least one interaction event in the last 30 days.
          type: integer
        byTier:
          description: |
            Tier breakdown derived from the `subscribers` row.
            - `free`: no subscribers row at all.
            - `trial`: row exists, `isInTrial = true`.
            - `plus` / `premium`: active row whose product maps to that tier.
            - `lapsed`: row exists, `isActive = false` and `isInTrial = false` (was paying, now not).
          type: object
          additionalProperties: false
          properties:
            free:
              type: integer
            trial:
              type: integer
            plus:
              type: integer
            premium:
              type: integer
            lapsed:
              type: integer
          required: [free, trial, plus, premium, lapsed]
      required:
        - totalUsers
        - adminCount
        - newUsersLast7d
        - newUsersLast30d
        - activeLast7d
        - activeLast30d
        - byTier

    AdminEngagementEventCount:
      type: object
      additionalProperties: false
      properties:
        kind:
          type: string
        count:
          type: integer
      required: [kind, count]

    AdminWeeklyActivityPoint:
      type: object
      additionalProperties: false
      properties:
        date:
          description: UTC calendar day (YYYY-MM-DD).
          type: string
        activeUsers:
          description: Distinct app users with ≥1 interaction event that day.
          type: integer
      required: [date, activeUsers]

    AdminEngagementMetrics:
      type: object
      additionalProperties: false
      properties:
        dau:
          type: integer
        wau:
          type: integer
        mau:
          type: integer
        wellbeingSessionsLast7d:
          type: object
          additionalProperties: false
          properties:
            breathing:
              type: integer
            meditation:
              type: integer
            other:
              type: integer
          required: [breathing, meditation, other]
        mealPlansLast7d:
          description: |
            Distinct (user, day) meal plan rows updated in the last 7 days.
            Approximates "users actively engaged with meal planning".
          type: integer
        boneBuddyInteractionsLast7d:
          description: |
            Count of `push_opened` interaction events in the last 7 days
            (every push in v1 is a Bone Buddy daily-nudge — see
            `pushSender.sendBoneBuddyPush`), so push opens are a faithful
            stand-in for Bone Buddy engagement.
          type: integer
        pushRecipientsLast7d:
          description: |
            Distinct users in `push_user_state` whose `lastSentAt` falls
            in the last 7 days (i.e. received at least one push).
          type: integer
        pushOpenedLast7d:
          description: Distinct openers (kind = "push_opened") in the last 7 days.
          type: integer
        pushOpenRate:
          description: |
            `pushOpenedLast7d / pushRecipientsLast7d`, capped at 1.0
            (multiple opens per recipient still count as one). `null` if
            no recipients in the window.
          type: ["number", "null"]
        weeklyActivity:
          description: |
            Per-day distinct-active-user counts for the last 7 calendar
            days, oldest first. Powers the dashboard sparkline.
          type: array
          items:
            $ref: "#/components/schemas/AdminWeeklyActivityPoint"
        eventCountsLast7d:
          type: array
          items:
            $ref: "#/components/schemas/AdminEngagementEventCount"
      required:
        - dau
        - wau
        - mau
        - wellbeingSessionsLast7d
        - mealPlansLast7d
        - boneBuddyInteractionsLast7d
        - pushRecipientsLast7d
        - pushOpenedLast7d
        - pushOpenRate
        - weeklyActivity
        - eventCountsLast7d

    AdminRevenueByProduct:
      type: object
      additionalProperties: false
      properties:
        productId:
          type: ["string", "null"]
        tier:
          description: Tier the product maps to (`plus`, `premium`, `unknown`).
          type: string
        activeCount:
          description: Active, non-trial subscribers on this product.
          type: integer
        monthlyCents:
          description: Sum of monthly-equivalent price (cents) across the active subscribers on this product.
          type: integer
      required: [productId, tier, activeCount, monthlyCents]

    AdminSubscriptionMetrics:
      type: object
      additionalProperties: false
      properties:
        activeCount:
          type: integer
        inTrialCount:
          type: integer
        willRenewCount:
          type: integer
        cancelledLast30d:
          type: integer
        churnRate30d:
          description: Cancellations / active-at-window-start. Null if no active users at window start.
          type: ["number", "null"]
        approxMrrCents:
          description: Sum of monthly-equivalent prices for active subscribers, in cents.
          type: integer
        approxArrCents:
          description: 12 × `approxMrrCents`. Convenience field for the dashboard.
          type: integer
        trialsStartedLast30d:
          description: |
            Server-managed 30-day Premium trials granted in the last 30
            days (`trialSource = "server"` with `trialEndsAt` falling in
            the window when projected back from now). Counts the grant
            event regardless of whether the trial later converted or
            expired.
          type: integer
        trialsActiveCount:
          description: |
            Server-managed trials currently in-flight: `trialSource = "server"`
            AND `trialEndsAt > now`. A snapshot, not a window, so it
            decays naturally as trials elapse.
          type: integer
        trialsConvertedToPaidLast30d:
          description: |
            Subscribers whose row now has any paid product (Plus OR Premium,
            `isActive = true AND isInTrial = false`) and whose underlying
            user account was created in the last 30 days. Headline
            conversion KPI for the new trial flow.
          type: integer
        trialsConvertedToPlusLast30d:
          description: |
            Subset of `trialsConvertedToPaidLast30d` whose product resolves
            to the Plus tier. Lets the dashboard show how trials
            distribute across Plus vs Premium without a second query.
          type: integer
        trialsConvertedToPremiumLast30d:
          description: Subset of `trialsConvertedToPaidLast30d` resolving to Premium.
          type: integer
        trialsExpiredWithoutConversionLast30d:
          description: |
            Server-managed trials whose `trialEndsAt` has passed (within
            the last 30 days) AND whose row has not converted to a paid
            product. Surfaces "trial → free" leakage.
          type: integer
        billingIssueCount:
          description: |
            Subscribers currently in a BILLING_ISSUE grace window
            (`billingIssueAt` set, `gracePeriodEndsAt > now`). Snapshot,
            not a window. The admin dashboard surfaces this so we can
            spot a payment-processor outage early.
          type: integer
        paidConvertedLast30d:
          description: |
            DEPRECATED alias for `trialsConvertedToPaidLast30d`, kept so
            existing dashboard tiles render against either field name.
            Will be removed after the admin client refactor.
          type: integer
        trialToPaidRate:
          description: |
            `trialsConvertedToPaidLast30d / trialsStartedLast30d`, or
            `null` if no trials started in the window.
          type: ["number", "null"]
        byTier:
          type: object
          additionalProperties: false
          properties:
            trial:
              type: integer
            plus:
              type: integer
            premium:
              type: integer
          required: [trial, plus, premium]
        revenueByProduct:
          description: Per-product revenue split (active, non-trial subscribers only).
          type: array
          items:
            $ref: "#/components/schemas/AdminRevenueByProduct"
      required:
        - activeCount
        - inTrialCount
        - willRenewCount
        - cancelledLast30d
        - churnRate30d
        - approxMrrCents
        - approxArrCents
        - trialsStartedLast30d
        - trialsActiveCount
        - trialsConvertedToPaidLast30d
        - trialsConvertedToPlusLast30d
        - trialsConvertedToPremiumLast30d
        - trialsExpiredWithoutConversionLast30d
        - billingIssueCount
        - paidConvertedLast30d
        - trialToPaidRate
        - byTier
        - revenueByProduct

    UserSubscription:
      type: object
      additionalProperties: false
      description: |
        Resolved subscription/trial state for the calling user, merged
        across the server-managed trial and any RevenueCat-mirrored
        store entitlement.
      properties:
        tier:
          type: string
          enum: [free, trial, plus, premium]
        isOnTrial:
          type: boolean
        trialSource:
          description: |
            Origin of the active trial period. `null` whenever
            `isOnTrial = false`.
          type: ["string", "null"]
          enum: [server, store, null]
        trialDayOf:
          description: |
            1-based day-of-trial in `1..trialLengthDays`. `null` when not
            on a server trial; for store trials we leave this `null` and
            let the client fall back to RevenueCat for day-of.
          type: ["integer", "null"]
        trialDaysRemaining:
          description: Whole days remaining in the trial (>= 0), or `null`.
          type: ["integer", "null"]
        trialLengthDays:
          description: |
            Total length of the server-managed trial in days. Always
            present so the client can render "Day X of Y" without
            hard-coding the constant.
          type: integer
        trialEndsAt:
          description: ISO-8601 wall-clock end of the trial, or `null`.
          type: ["string", "null"]
          format: date-time
        billingIssue:
          $ref: "#/components/schemas/BillingIssue"
        trialEndedAt:
          description: |
            ISO-8601 timestamp of a server-managed trial that has ended in
            the recent past (within the last 7 days) WITHOUT the user
            converting to a paid plan. The mobile dashboard uses this to
            render a one-time post-trial-ended banner. `null` whenever the
            user has never had a server trial, the trial is still active,
            the trial ended more than 7 days ago, OR the user is currently
            on a paid entitlement.
          type: ["string", "null"]
          format: date-time
      required:
        - tier
        - isOnTrial
        - trialSource
        - trialDayOf
        - trialDaysRemaining
        - trialLengthDays
        - trialEndsAt
        - trialEndedAt
        - billingIssue

